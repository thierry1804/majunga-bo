security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        images:
            # Allow public access to images (GET requests will be handled by PublicImageController)
            # DELETE requests will be handled by ImageController which requires authentication
            # Exclude /upload endpoint which requires authentication
            pattern: ^/api/images/[^/]+\.(webp|jpg|jpeg|png|gif|bmp)$
            stateless: true
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                limiter: 'App\Limiter\LoginRequestRateLimiter'
                max_attempts: 5
                interval: '1 minute'
        public_site_settings:
            # Allow public access to site settings (GET requests only)
            # IMPORTANT: Must be before the 'api' firewall to be evaluated first
            pattern: ^/api/site_settings
            stateless: true
            security: false
            methods: [GET]
        site_settings_public:
            # Allow public access to site-settings/public endpoints
            pattern: ^/api/site-settings/public
            stateless: true
            security: false
        public_api:
            pattern: ^/api/public
            stateless: true
            security: false
        webhooks:
            pattern: ^/api/webhooks
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/images/, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/site_settings, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/site-settings/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/webhooks, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/password, roles: PUBLIC_ACCESS }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/refresh, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
